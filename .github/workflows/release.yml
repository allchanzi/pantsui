name: release

# Every push to main: test -> tag the next version -> build binaries into a GitHub Release.
# Done in one workflow because tags pushed with GITHUB_TOKEN do not trigger other workflows.
# Bump minor/major by raising `version` in Cargo.toml; otherwise the patch number goes up.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: ${{ github.event.repository.name }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked

  tag:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: echo "tag=$(bash .github/next-tag.sh)" >> "$GITHUB_OUTPUT"
      - name: Push tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git push origin "HEAD:refs/tags/$TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag

  build:
    name: ${{ matrix.target }}
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Stamp the tag into the binary's --version; not committed. No --locked: the lockfile
      # entry for this crate's own version changes, dependencies stay as locked.
      - name: Build
        shell: bash
        run: |
          sed -i.bak "s/^version = .*/version = \"${TAG#v}\"/" Cargo.toml
          cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: tar -czf "$BIN-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "$BIN"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: ${{ env.BIN }}-${{ matrix.target }}.tar.gz
